[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-temporal-contract"
version = "0.1.0"
description = "A small cross-language contract for temporal semantics, provenance, and freshness in geospatial data sources."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
